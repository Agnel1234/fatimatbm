<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Fatima Church – Tambaram</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, serif; background: #f0f4f7; }

    #header {
      background: #1A2D42;
      color: #C9A84C;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #header span.sub {
      color: #a0b8c8;
      font-size: 12px;
      font-weight: normal;
      margin-left: 4px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 38px);
    }
  </style>
</head>
<body>

<div id="header">
  &#9765;&nbsp; Our Lady of Fatima Church
  <span class="sub">Tambaram, Chennai – Tamil Nadu</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map', {
    center: [12.9308, 80.0987],
    zoom: 15,
    zoomControl: true,
    scrollWheelZoom: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var churchIcon = L.divIcon({
    className: '',
    html: '<div style="background:#1A2D42;color:#C9A84C;border:2px solid #C9A84C;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,0.4);">&#9765;</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -20]
  });

  L.marker([12.9308, 80.0987], { icon: churchIcon })
    .addTo(map)
    .bindPopup(
      '<div style="font-family:Georgia,serif;min-width:180px;">' +
      '<b style="color:#1A2D42;font-size:13px;">Our Lady of Fatima Church</b><br/>' +
      '<span style="color:#555;font-size:11px;">Tambaram, Chennai<br/>Tamil Nadu – 600 045</span>' +
      '</div>'
    )
    .openPopup();

  // Anbiyam zone boundary reference circle
  L.circle([12.9308, 80.0987], {
    color: '#2C6E7A',
    fillColor: '#2C6E7A',
    fillOpacity: 0.06,
    radius: 1200,
    weight: 1.5,
    dashArray: '6 4'
  }).addTo(map).bindTooltip('Parish Zone (~1.2km radius)', {
    permanent: false,
    direction: 'top',
    className: 'zone-tip'
  });
</script>

</body>
</html>
